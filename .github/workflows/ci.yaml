name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go test ./... -count=1 -timeout=120s

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install pytest==8.4.2

      - name: Marker corrections paste and recheck (STOMPY-3744)
        run: python -m pytest scripts/red/test_marker_line_3744.py -q -p no:cacheprovider
